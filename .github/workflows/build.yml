name: build-release

# 触发条件：推送 v 开头的 tag（如 v1.0.0），或在 Actions 页面手动触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 上传 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10/11 x64：静态 CRT，无需安装 VC++ 运行库
          # 关键：MSVC 默认动态链接 CRT；下面的 rustflags 必须保留，
          # 否则分发到裸机可能缺 VCRUNTIME140.dll / UCRT 相关 DLL。
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: config-api-windows-x64
            bin: config-api.exe
            rustflags: "-C target-feature=+crt-static"

          # 信创 x86_64：musl 静态，不依赖 glibc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: config-api-linux-x64-musl
            bin: config-api
            rustflags: ""

          # 信创 ARM64（鲲鹏/飞腾）：原生 ARM 机器编译 musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: config-api-linux-arm64-musl
            bin: config-api
            rustflags: ""

          # Apple Silicon macOS
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: config-api-macos-arm64
            bin: config-api
            rustflags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          # config.toml 与 README 是分发必需品，缺失时不要中断构建
          if [ -f config.toml ]; then cp config.toml dist/; fi
          if [ -f README.md ]; then cp README.md dist/; fi
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          set -euo pipefail
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
          ls -l *.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
